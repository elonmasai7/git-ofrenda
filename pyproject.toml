[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-ofrenda"
dynamic = ["version"]
description = "An ofrenda for the files your repo has lost, written by a model running on your own machine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["git", "ollama", "llama.cpp", "gemma", "dia-de-los-muertos", "local-ai"]
classifiers = ["Programming Language :: Python :: 3", "Environment :: Console", "Topic :: Software Development :: Version Control :: Git"]
dependencies = []

[project.scripts]
git-ofrenda = "git_ofrenda.cli:main"

[tool.setuptools.dynamic]
version = { attr = "git_ofrenda.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
git_ofrenda = ["static/*"]
