<rect width="1200" height="640" rx="12" fill="#14091a"/>
<rect x="20" y="64" width="1160" height="556" rx="12" fill="none" stroke="#4a3055" stroke-dasharray="3 6"/>
<text x="40" y="92" font-size="12" fill="#a897b0" letter-spacing="1.5">EVERYTHING BELOW RUNS ON YOUR MACHINE</text>
<text x="40" y="40" font-size="20" font-weight="600" fill="#f3e6d3">git-ofrenda architecture</text>
<rect x="40" y="255" width="150" height="80" rx="8" fill="#1d1222" stroke="#4a3055" stroke-width="1.5"/>
<text x="115.0" y="283" text-anchor="middle" font-size="16" font-weight="600" fill="#ffb347" font-family="ui-monospace,Menlo,Consolas,monospace">git repo</text>
<text x="115.0" y="305" text-anchor="middle" font-size="12" fill="#a897b0">history on disk</text>
<rect x="250" y="195" width="180" height="100" rx="8" fill="#1d1222" stroke="#4a3055" stroke-width="1.5"/>
<text x="340.0" y="223" text-anchor="middle" font-size="16" font-weight="600" fill="#ffb347" font-family="ui-monospace,Menlo,Consolas,monospace">gitscan</text>
<text x="340.0" y="245" text-anchor="middle" font-size="12" fill="#a897b0">deleted files, renames</text>
<text x="340.0" y="262" text-anchor="middle" font-size="12" fill="#a897b0">followed, final contents</text>
<text x="340.0" y="279" text-anchor="middle" font-size="12" fill="#a897b0">recovered with git show</text>
