<text x="340.0" y="363" text-anchor="middle" font-size="16" font-weight="600" fill="#ffb347" font-family="ui-monospace,Menlo,Consolas,monospace">facts</text>
<text x="340.0" y="385" text-anchor="middle" font-size="12" fill="#a897b0">function names, imports,</text>
<text x="340.0" y="402" text-anchor="middle" font-size="12" fill="#a897b0">docstring / comment</text>
