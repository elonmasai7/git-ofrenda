<text x="585.0" y="283" text-anchor="middle" font-size="16" font-weight="600" fill="#ffb347" font-family="ui-monospace,Menlo,Consolas,monospace">poet</text>
<text x="585.0" y="305" text-anchor="middle" font-size="12" fill="#a897b0">cache, then model,</text>
<text x="585.0" y="322" text-anchor="middle" font-size="12" fill="#a897b0">then template</text>
<text x="585.0" y="339" text-anchor="middle" font-size="12" fill="#a897b0">(never fails)</text>
