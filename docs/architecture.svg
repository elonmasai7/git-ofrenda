<text x="835.0" y="435" text-anchor="middle" font-size="12" fill="#a897b0">localhost only</text>
<text x="835.0" y="452" text-anchor="middle" font-size="12" fill="#a897b0">streams chat tokens</text>
<rect x="990" y="145" width="170" height="90" rx="8" fill="#1d1222" stroke="#4a3055" stroke-width="1.5"/>
<text x="1075.0" y="173" text-anchor="middle" font-size="16" font-weight="600" fill="#ffb347" font-family="ui-monospace,Menlo,Consolas,monospace">output file</text>
<text x="1075.0" y="195" text-anchor="middle" font-size="12" fill="#a897b0">ofrenda.html / .md / .json</text>
