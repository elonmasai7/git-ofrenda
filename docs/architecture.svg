<text x="585.0" y="124" text-anchor="middle" font-size="16" font-weight="600" fill="#ffb347" font-family="ui-monospace,Menlo,Consolas,monospace">cache</text>
<text x="585.0" y="146" text-anchor="middle" font-size="12" fill="#a897b0">verses.json</text>
<text x="585.0" y="163" text-anchor="middle" font-size="12" fill="#a897b0">seances/&lt;repo&gt;.json</text>
<rect x="750" y="145" width="170" height="90" rx="8" fill="#1d1222" stroke="#4a3055" stroke-width="1.5"/>
<text x="835.0" y="173" text-anchor="middle" font-size="16" font-weight="600" fill="#ffb347" font-family="ui-monospace,Menlo,Consolas,monospace">render</text>
