<text x="1075.0" y="413" text-anchor="middle" font-size="16" font-weight="600" fill="#ffb347" font-family="ui-monospace,Menlo,Consolas,monospace">browser</text>
<text x="1075.0" y="435" text-anchor="middle" font-size="12" fill="#a897b0">your séance</text>
<rect x="460" y="505" width="250" height="80" rx="8" fill="#1d1222" stroke="#ffb347" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="585.0" y="533" text-anchor="middle" font-size="16" font-weight="600" fill="#ffb347" font-family="ui-monospace,Menlo,Consolas,monospace">model server</text>
<text x="585.0" y="555" text-anchor="middle" font-size="12" fill="#a897b0">Ollama, llama.cpp, LM Studio...</text>
<text x="585.0" y="572" text-anchor="middle" font-size="12" fill="#a897b0">optional, you run it</text>
